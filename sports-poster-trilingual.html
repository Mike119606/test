<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>United by Sports · 以体育团结 · Unidad por el Deporte</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;700;900&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
    <style>
        @page {
            size: 60cm 90cm;
            margin: 0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a1a;
            font-family: 'Montserrat', 'Noto Sans SC', sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 30px 0;
            min-height: 100vh;
        }

        .poster-wrapper {
            transform: scale(0.45);
            transform-origin: top center;
        }

        .poster {
            width: 60cm;
            height: 90cm;
            position: relative;
            overflow: hidden;
            background: #0a0a1a;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
        }

        /* ========== 四角模块通用 ========== */
        .corner-module {
            position: absolute;
            overflow: hidden;
            z-index: 1;
        }

        .corner-module img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .corner-module .overlay {
            position: absolute;
            inset: 0;
        }

        .corner-module .text-block {
            position: absolute;
            bottom: 2cm;
            left: 2cm;
            right: 2cm;
            z-index: 3;
        }

        /* 左上：中国乒乓球 */
        .module-tl {
            top: 0;
            left: 0;
            width: 31cm;
            height: 46cm;
            clip-path: polygon(0 0, 100% 0, 92% 100%, 0 100%);
        }

        .module-tl .overlay {
            background: linear-gradient(135deg, rgba(180, 0, 0, 0.3) 0%, rgba(255, 215, 0, 0.15) 100%);
        }

        .module-tl .text-cn {
            font-family: 'ZCOOL QingKe HuangYou', 'Noto Sans SC', sans-serif;
            font-size: 3.2cm;
            color: #ffd700;
            text-shadow: 0 0.2cm 0.6cm rgba(180, 0, 0, 0.9), 0 0 0.3cm rgba(0,0,0,0.5);
            letter-spacing: 0.1cm;
        }

        .module-tl .text-en {
            font-family: 'Oswald', sans-serif;
            font-weight: 600;
            font-size: 1.1cm;
            color: #fff;
            letter-spacing: 0.3cm;
            margin-top: 0.2cm;
            text-shadow: 0 0.1cm 0.3cm rgba(0,0,0,0.7);
        }

        /* 右上：西班牙足球 */
        .module-tr {
            top: 0;
            right: 0;
            width: 31cm;
            height: 46cm;
            clip-path: polygon(8% 0, 100% 0, 100% 100%, 0 100%);
        }

        .module-tr .overlay {
            background: linear-gradient(225deg, rgba(200, 0, 0, 0.3) 0%, rgba(255, 200, 0, 0.15) 100%);
        }

        .module-tr .text-block {
            text-align: right;
            right: 2cm;
            left: auto;
        }

        .module-tr .text-es {
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: 3cm;
            color: #fff;
            text-shadow: 0 0.2cm 0.6cm rgba(200, 0, 0, 0.9), 0 0 0.3cm rgba(0,0,0,0.5);
            letter-spacing: 0.1cm;
        }

        .module-tr .text-en {
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
            font-size: 1.1cm;
            color: #ffd700;
            letter-spacing: 0.3cm;
            margin-top: 0.2cm;
            text-shadow: 0 0.1cm 0.3cm rgba(0,0,0,0.7);
        }

        /* 左下：中国文化融合 */
        .module-bl {
            bottom: 0;
            left: 0;
            width: 31cm;
            height: 46cm;
            clip-path: polygon(0 0, 100% 8%, 92% 100%, 0 100%);
        }

        .module-bl .overlay {
            background: linear-gradient(315deg, rgba(255, 250, 240, 0.2) 0%, rgba(180, 100, 50, 0.1) 100%);
        }

        .module-bl .text-cn {
            font-family: 'ZCOOL QingKe HuangYou', 'Noto Sans SC', sans-serif;
            font-size: 3.5cm;
            color: #8b2500;
            text-shadow: 0 0.1cm 0.4cm rgba(255, 240, 220, 0.8);
            letter-spacing: 0.2cm;
        }

        .module-bl .text-en {
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
            font-size: 1cm;
            color: rgba(60, 30, 10, 0.7);
            letter-spacing: 0.2cm;
            margin-top: 0.2cm;
        }

        /* 右下：西班牙文化融合 */
        .module-br {
            bottom: 0;
            right: 0;
            width: 31cm;
            height: 46cm;
            clip-path: polygon(8% 8%, 100% 0, 100% 100%, 0 100%);
        }

        .module-br .overlay {
            background: linear-gradient(135deg, rgba(255, 140, 0, 0.25) 0%, rgba(180, 50, 0, 0.2) 100%);
        }

        .module-br .text-block {
            text-align: right;
            right: 2cm;
            left: auto;
        }

        .module-br .text-es {
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: 4cm;
            color: #fff;
            text-shadow: 0 0.2cm 0.6cm rgba(180, 50, 0, 0.9), 0 0 0.3cm rgba(0,0,0,0.5);
            letter-spacing: 0.3cm;
        }

        .module-br .text-en {
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
            font-size: 1cm;
            color: #ffe0b2;
            letter-spacing: 0.2cm;
            margin-top: 0.2cm;
            text-shadow: 0 0.1cm 0.3cm rgba(0,0,0,0.5);
        }

        /* ========== 中心圆形模块 ========== */
        .center-module {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 36cm;
            height: 36cm;
            border-radius: 50%;
            overflow: hidden;
            z-index: 5;
            box-shadow:
                0 0 3cm rgba(255, 215, 0, 0.4),
                0 0 6cm rgba(255, 140, 0, 0.2),
                inset 0 0 2cm rgba(255, 215, 0, 0.15);
        }

        .center-module img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .center-module .center-glow {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.2) 0%, transparent 70%);
            z-index: 2;
        }

        /* ========== 底部中央摘要 ========== */
        .bottom-summary {
            position: absolute;
            bottom: 2.5cm;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            width: 50cm;
            padding: 1cm 2cm;
        }

        .bottom-summary .summary-en {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 2.2cm;
            color: #fff;
            letter-spacing: 0.2cm;
            text-transform: uppercase;
            text-shadow: 0 0.2cm 0.6cm rgba(0, 0, 0, 0.8), 0 0 0.3cm rgba(255, 215, 0, 0.3);
            line-height: 1.2;
        }

        .bottom-summary .summary-cn {
            font-family: 'ZCOOL QingKe HuangYou', 'Noto Sans SC', sans-serif;
            font-size: 1.8cm;
            color: #ffd700;
            letter-spacing: 0.3cm;
            margin-top: 0.4cm;
            text-shadow: 0 0.1cm 0.4cm rgba(0, 0, 0, 0.8);
        }

        .bottom-summary .summary-divider {
            width: 6cm;
            height: 0.1cm;
            background: linear-gradient(90deg, transparent, #ffd700, transparent);
            margin: 0.5cm auto;
        }

        /* ========== 装饰元素 ========== */
        .deco-line {
            position: absolute;
            z-index: 4;
            background: rgba(255, 215, 0, 0.6);
        }

        .deco-line.h-top {
            top: 4cm;
            left: 2cm;
            right: 2cm;
            height: 0.05cm;
        }

        .deco-line.h-bottom {
            bottom: 8cm;
            left: 2cm;
            right: 2cm;
            height: 0.05cm;
        }

        /* ========== 打印样式 ========== */
        @media print {
            body {
                background: #fff;
                padding: 0;
            }
            .poster-wrapper {
                transform: none;
            }
            .poster {
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <div class="poster-wrapper">
        <div class="poster">

            <!-- 左上：中国乒乓球 -->
            <div class="corner-module module-tl">
                <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=close-up%20of%20red%20table%20tennis%20paddle%20hitting%20white%20ball%20with%20kinetic%20motion%20lines%2C%20bright%20Chinese%20red%20and%20gold%20background%2C%20dynamic%20sports%20photography%2C%20high%20contrast%2C%20modern%20vector%20illustration%20style%2C%204K%2C%20bold%20geometric%20shapes&image_size=portrait_4_3" alt="Table Tennis China">
                <div class="overlay"></div>
                <div class="text-block">
                    <div class="text-cn">国球乒乓</div>
                    <div class="text-en">TABLE TENNIS · CHINA</div>
                </div>
            </div>

            <!-- 右上：西班牙足球 -->
            <div class="corner-module module-tr">
                <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=football%20player%20kicking%20classic%20leather%20football%20with%20strong%20motion%20blur%2C%20Spanish%20La%20Roja%20red%20and%20yellow%20color%20scheme%2C%20dynamic%20action%20shot%2C%20high%20contrast%2C%20modern%20vector%20illustration%20style%2C%204K%2C%20bold%20geometric%20shapes&image_size=portrait_4_3" alt="Football Spain">
                <div class="overlay"></div>
                <div class="text-block">
                    <div class="text-es">FÚTBOL · ESPAÑA</div>
                    <div class="text-en">FOOTBALL · SPAIN</div>
                </div>
            </div>

            <!-- 左下：中国文化融合 -->
            <div class="corner-module module-bl">
                <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=famous%20Chinese%20table%20tennis%20champion%20athlete%20in%20iconic%20victory%20pose%2C%20dynamic%20action%2C%20Chinese%20red%20and%20gold%20color%20scheme%2C%20dramatic%20rim%20lighting%2C%20modern%20vector%20illustration%20style%2C%204K%2C%20bold%20geometric%20shapes%2C%20high%20contrast&image_size=portrait_4_3" alt="Chinese Table Tennis Champion">
                <div class="overlay"></div>
                <div class="text-block">
                    <div class="text-cn">中国力量</div>
                    <div class="text-en">CHINESE POWER · CULTURE FUSION</div>
                </div>
            </div>

            <!-- 右下：西班牙文化融合 -->
            <div class="corner-module module-br">
                <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=famous%20Spanish%20football%20star%20athlete%20in%20iconic%20celebration%20pose%2C%20muscular%20dynamic%20action%2C%20warm%20Spanish%20red%20and%20gold%20color%20scheme%2C%20dramatic%20lighting%2C%20modern%20vector%20illustration%20style%2C%204K%2C%20bold%20geometric%20shapes%2C%20high%20contrast&image_size=portrait_4_3" alt="Spanish Football Star">
                <div class="overlay"></div>
                <div class="text-block">
                    <div class="text-es">PASIÓN</div>
                    <div class="text-en">PASSION · SPAIN CULTURE</div>
                </div>
            </div>

            <!-- 中心圆形模块 -->
            <div class="center-module">
                <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=glowing%20golden%20trophy%20with%20swirling%20vortex%20blending%20table%20tennis%20paddle%20and%20football%20together%2C%20cosmic%20blue%20starry%20background%2C%20radiant%20epic%20composition%2C%20high%20contrast%2C%204K%2C%20modern%20vector%20illustration%2C%20majestic%20golden%20light%20rays&image_size=square_hd" alt="Center Trophy Vortex">
                <div class="center-glow"></div>
            </div>

            <!-- 装饰线 -->
            <div class="deco-line h-top"></div>
            <div class="deco-line h-bottom"></div>

            <!-- 底部中央摘要 -->
            <div class="bottom-summary">
                <div class="summary-divider"></div>
                <div class="summary-en">UNITED BY SPORTS · DRIVEN BY PASSION</div>
                <div class="summary-cn">由体育团结 · 以激情驱动</div>
                <div class="summary-divider"></div>
            </div>

        </div>
    </div>
</body>
</html>
