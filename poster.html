<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>SPORT CULTURE · 体育文化对撞</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    font-family: "Microsoft YaHei", sans-serif;
  }
  .toolbar {
    margin-bottom: 15px;
    display: flex;
    gap: 10px;
  }
  .toolbar button {
    padding: 10px 24px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: linear-gradient(135deg, #C60B1E, #DE2910);
    color: #fff;
    transition: transform 0.15s;
  }
  .toolbar button:hover { transform: translateY(-2px); }
  .toolbar button.secondary {
    background: #444;
  }
  .canvas-wrap {
    max-width: 90vw;
    max-height: 80vh;
    overflow: auto;
    border: 2px solid #333;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  canvas { display: block; transform-origin: top left; }
  canvas.fit-screen {
    max-width: 100%;
    height: auto;
  }
  .loading {
    color: #fff;
    font-size: 18px;
    margin-bottom: 10px;
  }
</style>
</head>
<body>

<div class="toolbar">
  <button onclick="downloadPoster()">⬇ 下载海报 (PNG)</button>
  <button onclick="renderPoster()">🔄 重新渲染</button>
  <button class="secondary" onclick="toggleFit()">📐 适应屏幕</button>
</div>
<div class="loading" id="loading">渲染中...</div>
<div class="canvas-wrap">
  <canvas id="posterCanvas" width="4000" height="6000"></canvas>
</div>

<script>
const canvas = document.getElementById('posterCanvas');
const ctx = canvas.getContext('2d');
const W = 4000, H = 6000;
const loadingEl = document.getElementById('loading');

// ===== 主题配置 =====
const LEFT = {
  x0: 0, x1: 2000, cx: 1000,
  color: '#C60B1E',
  color2: '#FFC400',
  white: '#FFFFFF',
  text: {
    main: 'FÚTBOL ESPAÑOL',
    sub: 'Pasión, técnica y garra.',
    helper: 'El deporte rey de España. ¡Vamos España!',
    deco: ['TIKI-TAKA', 'LA ROJA', '¡GOOOL!'],
    slogan: '¡VAMOS ESPAÑA!',
    fontMain: 'Impact, "Arial Black", sans-serif',
    fontBody: '"Arial", sans-serif'
  }
};

const RIGHT = {
  x0: 2000, x1: 4000, cx: 3000,
  color: '#DE2910',
  color2: '#FFDE00',
  white: '#FFFFFF',
  ink: '#1a1a1a',
  text: {
    main: '中国乒乓',
    sub: '小球转动大球 · 国球荣耀',
    helper: '乒乒乓乓，天下无双；银球飞旋，为国争光。',
    deco: ['国球', '荣耀', '银球飞旋'],
    slogan: '国球荣耀 · 天下无双',
    fontMain: '"Microsoft YaHei", "PingFang SC", "Source Han Sans CN", sans-serif',
    fontBody: '"Microsoft YaHei", "PingFang SC", sans-serif'
  }
};

// ===== 工具函数 =====
function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function drawRoundedRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// 分段测量并绘制居中文本
function drawCenteredSegments(cx, y, segments, alignBaseline = 'middle') {
  // segments: [{text, font, color}]
  ctx.textAlign = 'left';
  ctx.textBaseline = alignBaseline;
  let totalWidth = 0;
  segments.forEach(seg => {
    ctx.font = seg.font;
    totalWidth += ctx.measureText(seg.text).width;
  });
  let startX = cx - totalWidth / 2;
  segments.forEach(seg => {
    ctx.font = seg.font;
    ctx.fillStyle = seg.color;
    ctx.fillText(seg.text, startX, y);
    startX += ctx.measureText(seg.text).width;
  });
  return totalWidth;
}

// ===== 背景层 =====
function drawBackground() {
  // 左侧渐变
  const lg = ctx.createLinearGradient(0, 0, 0, H);
  lg.addColorStop(0, '#8a0815');
  lg.addColorStop(0.4, LEFT.color);
  lg.addColorStop(0.7, '#a80918');
  lg.addColorStop(1, '#5a0510');
  ctx.fillStyle = lg;
  ctx.fillRect(LEFT.x0, 0, LEFT.x1 - LEFT.x0, H);

  // 右侧渐变
  const rg = ctx.createLinearGradient(2000, 0, 2000, H);
  rg.addColorStop(0, '#8a1808');
  rg.addColorStop(0.4, RIGHT.color);
  rg.addColorStop(0.7, '#b01f0a');
  rg.addColorStop(1, '#5a1005');
  ctx.fillStyle = rg;
  ctx.fillRect(RIGHT.x0, 0, RIGHT.x1 - RIGHT.x0, H);

  // 左侧草皮纹理（15%透明度）
  ctx.save();
  ctx.globalAlpha = 0.12;
  for (let i = 0; i < 80; i++) {
    const y = (i / 80) * H;
    ctx.fillStyle = i % 2 === 0 ? '#3a7d3a' : '#2d6b2d';
    ctx.fillRect(LEFT.x0, y, LEFT.x1 - LEFT.x0, H / 80 + 2);
  }
  ctx.restore();

  // 右侧祥云/墨色纹理（10%透明度）
  ctx.save();
  ctx.globalAlpha = 0.1;
  ctx.fillStyle = RIGHT.ink;
  for (let i = 0; i < 60; i++) {
    const x = LEFT.x1 + Math.random() * 2000;
    const y = Math.random() * H;
    const r = 80 + Math.random() * 200;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // 顶部到底部的暗角渐变（增强视觉）
  const vg = ctx.createLinearGradient(0, 0, 0, H);
  vg.addColorStop(0, 'rgba(0,0,0,0.35)');
  vg.addColorStop(0.15, 'rgba(0,0,0,0)');
  vg.addColorStop(0.85, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.4)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

// ===== 放射光芒装饰 =====
function drawRays(cx, cy, radius, color, count = 24, alpha = 0.15) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2;
    ctx.save();
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-radius * 0.06, radius);
    ctx.lineTo(radius * 0.06, radius);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

// ===== 足球图案 =====
function drawSoccerBall(cx, cy, r, color) {
  ctx.save();
  ctx.translate(cx, cy);
  // 球体外圈
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = r * 0.04;
  ctx.stroke();

  // 五边形图案（简化）
  ctx.fillStyle = '#1a1a1a';
  // 中心五边形
  for (let i = 0; i < 5; i++) {
    const a1 = (i / 5) * Math.PI * 2 - Math.PI / 2;
    const a2 = ((i + 1) / 5) * Math.PI * 2 - Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(a1) * r * 0.55, Math.sin(a1) * r * 0.55);
    ctx.lineTo(Math.cos(a2) * r * 0.55, Math.sin(a2) * r * 0.55);
    ctx.closePath();
    ctx.fill();
  }
  // 外部五边形顶点
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2 - Math.PI / 2;
    const px = Math.cos(a) * r * 0.78;
    const py = Math.sin(a) * r * 0.78;
    ctx.beginPath();
    ctx.arc(px, py, r * 0.12, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// ===== 乒乓球拍图案 =====
function drawPaddle(cx, cy, scale, bladeColor, handleColor) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);
  // 拍柄
  ctx.fillStyle = handleColor;
  drawRoundedRect(-35, 80, 70, 220, 15);
  ctx.fill();
  ctx.strokeStyle = '#3a2a1a';
  ctx.lineWidth = 4;
  ctx.stroke();
  // 拍面
  ctx.fillStyle = bladeColor;
  ctx.beginPath();
  ctx.ellipse(0, -20, 130, 150, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 6;
  ctx.stroke();
  // 拍面反光弧线
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.ellipse(0, -20, 90, 110, 0, Math.PI * 0.2, Math.PI * 0.8);
  ctx.stroke();
  ctx.restore();
}

// ===== 乒乓球 =====
function drawPingPong(cx, cy, r) {
  ctx.save();
  // 球体
  const grad = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, r * 0.1, cx, cy, r);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(0.7, '#f0f0f0');
  grad.addColorStop(1, '#cccccc');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();
  // 旋转弧线
  ctx.strokeStyle = 'rgba(255,222,0,0.6)';
  ctx.lineWidth = r * 0.15;
  ctx.beginPath();
  ctx.arc(cx, cy, r * 0.7, 0, Math.PI * 1.2);
  ctx.stroke();
  ctx.restore();
}

// ===== 中心对撞元素 =====
function drawCenterCollision() {
  const centerX = 2000;
  const centerY = H * 0.52;

  // 几何斜线分隔背景
  ctx.save();
  ctx.globalAlpha = 0.15;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 8;
  for (let i = -3; i <= 3; i++) {
    ctx.beginPath();
    ctx.moveTo(centerX + i * 60, 0);
    ctx.lineTo(centerX + i * 60 + 200, H);
    ctx.stroke();
  }
  ctx.restore();

  // 中央竖线
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(centerX, 0);
  ctx.lineTo(centerX, H);
  ctx.stroke();

  // 左侧半颗足球（裁剪右半部分）
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, centerY - 350, centerX, 700);
  ctx.clip();
  drawSoccerBall(centerX, centerY, 320, '#ffffff');
  ctx.restore();

  // 右侧半块球拍（裁剪左半部分）
  ctx.save();
  ctx.beginPath();
  ctx.rect(centerX, centerY - 400, centerX, 800);
  ctx.clip();
  drawPaddle(centerX, centerY, 1.4, '#DE2910', '#8B4513');
  ctx.restore();

  // 碰撞闪光
  ctx.save();
  ctx.translate(centerX, centerY);
  const flashGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, 200);
  flashGrad.addColorStop(0, 'rgba(255,255,255,0.9)');
  flashGrad.addColorStop(0.5, 'rgba(255,196,0,0.4)');
  flashGrad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = flashGrad;
  ctx.beginPath();
  ctx.arc(0, 0, 200, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// ===== 左侧装饰元素 =====
function drawLeftDecorations() {
  // 放射光芒（背景）
  drawRays(LEFT.cx, H * 0.32, 1800, '#FFC400', 28, 0.12);

  // 球网纹理（右上区域）
  ctx.save();
  ctx.globalAlpha = 0.15;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 3;
  const netX = LEFT.x1 - 380, netY = 280, netW = 350, netH = 500;
  for (let i = 0; i <= 10; i++) {
    ctx.beginPath();
    ctx.moveTo(netX + (netW / 10) * i, netY);
    ctx.lineTo(netX + (netW / 10) * i + 30, netY + netH);
    ctx.stroke();
  }
  for (let j = 0; j <= 14; j++) {
    ctx.beginPath();
    ctx.moveTo(netX, netY + (netH / 14) * j);
    ctx.lineTo(netX + netW, netY + (netH / 14) * j + 20);
    ctx.stroke();
  }
  ctx.restore();

  // 球衣号码装饰
  ctx.save();
  ctx.font = 'bold 900px Impact, sans-serif';
  ctx.fillStyle = 'rgba(255,196,0,0.18)';
  ctx.textAlign = 'center';
  ctx.fillText('7', LEFT.cx, H * 0.68);
  ctx.restore();

  // 球迷剪影（底部）
  ctx.save();
  ctx.globalAlpha = 0.2;
  ctx.fillStyle = '#1a1a1a';
  for (let i = 0; i < 25; i++) {
    const x = LEFT.x0 + 80 + i * 75;
    const h = 80 + Math.random() * 120;
    ctx.beginPath();
    ctx.arc(x, H - 380 - h * 0.3, 20, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(x - 15, H - 380 - h * 0.25, 30, h);
  }
  ctx.restore();
}

// ===== 右侧装饰元素 =====
function drawRightDecorations() {
  // 放射光芒
  drawRays(RIGHT.cx, H * 0.32, 1800, '#FFDE00', 28, 0.12);

  // 金色五星
  function drawStar(cx, cy, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a1 = (i / 5) * Math.PI * 2 - Math.PI / 2;
      const a2 = ((i + 0.5) / 5) * Math.PI * 2 - Math.PI / 2;
      if (i === 0) ctx.moveTo(cx + Math.cos(a1) * r, cy + Math.sin(a1) * r);
      else ctx.lineTo(cx + Math.cos(a1) * r, cy + Math.sin(a1) * r);
      ctx.lineTo(cx + Math.cos(a2) * r * 0.45, cy + Math.sin(a2) * r * 0.45);
    }
    ctx.closePath();
    ctx.fill();
  }
  ctx.save();
  ctx.globalAlpha = 0.7;
  drawStar(RIGHT.x0 + 120, 260, 55, '#FFDE00');
  for (let i = 0; i < 4; i++) {
    const angle = (i / 4) * Math.PI * 2 - Math.PI / 2;
    drawStar(RIGHT.x0 + 120 + Math.cos(angle) * 120, 260 + Math.sin(angle) * 120, 22, '#FFDE00');
  }
  ctx.restore();

  // 球路弧线光轨
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 5;
  ctx.setLineDash([20, 15]);
  ctx.beginPath();
  ctx.moveTo(RIGHT.x0 + 50, 1400);
  ctx.bezierCurveTo(RIGHT.cx - 300, 1100, RIGHT.cx + 300, 1700, RIGHT.x1 - 50, 1300);
  ctx.stroke();
  ctx.setLineDash([]);
  // 光轨上的乒乓球
  drawPingPong(RIGHT.cx - 100, 1250, 35);
  drawPingPong(RIGHT.cx + 150, 1450, 30);
  ctx.restore();

  // 祥云纹样（简化）
  ctx.save();
  ctx.globalAlpha = 0.15;
  ctx.strokeStyle = '#FFDE00';
  ctx.lineWidth = 8;
  for (let i = 0; i < 4; i++) {
    const x = RIGHT.x0 + 100 + i * 450;
    const y = H - 500 - i * 30;
    ctx.beginPath();
    ctx.arc(x, y, 60, Math.PI, Math.PI * 2);
    ctx.arc(x + 50, y, 40, Math.PI, Math.PI * 2);
    ctx.arc(x + 90, y + 10, 50, Math.PI, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();

  // 印章式元素
  ctx.save();
  ctx.translate(RIGHT.x1 - 220, H * 0.66);
  ctx.rotate(-0.1);
  ctx.fillStyle = '#DE2910';
  drawRoundedRect(-100, -100, 200, 200, 10);
  ctx.fill();
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 4;
  drawRoundedRect(-90, -90, 180, 180, 6);
  ctx.stroke();
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 52px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('国球', 0, -15);
  ctx.fillText('荣耀', 0, 45);
  ctx.restore();
}

// ===== 文字层 =====
function drawTexts() {
  // 顶部英文小标题（横跨两侧）
  drawCenteredSegments(W / 2, 120, [
    { text: 'SPORT CULTURE · 体育文化对撞', font: 'bold 72px Impact, "Microsoft YaHei", sans-serif', color: '#ffffff' }
  ]);
  // 顶部装饰线
  ctx.strokeStyle = '#FFC400';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(W / 2 - 600, 160);
  ctx.lineTo(W / 2 + 600, 160);
  ctx.stroke();

  // ===== 左侧文字 =====
  // 主标题 FÚTBOL ESPAÑOL
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  // 文字阴影
  ctx.font = `900 200px ${LEFT.text.fontMain}`;
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillText(LEFT.text.main, LEFT.cx + 8, 520 + 8);
  // 白色粗描边
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 10;
  ctx.lineJoin = 'round';
  ctx.strokeText(LEFT.text.main, LEFT.cx, 520);
  // 主文字（金黄渐变）
  const mainLg = ctx.createLinearGradient(0, 350, 0, 700);
  mainLg.addColorStop(0, '#FFE066');
  mainLg.addColorStop(0.5, '#FFC400');
  mainLg.addColorStop(1, '#FF9500');
  ctx.fillStyle = mainLg;
  ctx.fillText(LEFT.text.main, LEFT.cx, 520);
  // 深色细描边
  ctx.strokeStyle = '#5a0510';
  ctx.lineWidth = 4;
  ctx.strokeText(LEFT.text.main, LEFT.cx, 520);
  ctx.restore();

  // 副标题
  drawCenteredSegments(LEFT.cx, 720, [
    { text: LEFT.text.sub, font: `italic bold 56px ${LEFT.text.fontBody}`, color: '#ffffff' }
  ]);

  // 辅助文案
  drawCenteredSegments(LEFT.cx, 810, [
    { text: LEFT.text.helper, font: `38px ${LEFT.text.fontBody}`, color: 'rgba(255,255,255,0.85)' }
  ]);

  // 装饰文字（竖排标签）
  ctx.save();
  ctx.translate(LEFT.x0 + 130, 1000);
  ctx.rotate(-Math.PI / 2);
  ctx.font = `bold 44px ${LEFT.text.fontMain}`;
  ctx.fillStyle = LEFT.color2;
  ctx.fillText(LEFT.text.deco[0], 0, 0);
  ctx.restore();

  ctx.save();
  ctx.translate(LEFT.x1 - 130, 1700);
  ctx.rotate(Math.PI / 2);
  ctx.font = `bold 44px ${LEFT.text.fontMain}`;
  ctx.fillStyle = '#ffffff';
  ctx.fillText(LEFT.text.deco[1], 0, 0);
  ctx.restore();

  // ¡GOOOL! 圆形标签
  ctx.save();
  ctx.translate(LEFT.cx, 2200);
  ctx.beginPath();
  ctx.arc(0, 0, 130, 0, Math.PI * 2);
  ctx.fillStyle = LEFT.color2;
  ctx.fill();
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 6;
  ctx.stroke();
  ctx.font = `bold 52px ${LEFT.text.fontMain}`;
  ctx.fillStyle = LEFT.color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(LEFT.text.deco[2], 0, 0);
  ctx.restore();

  // ===== 右侧文字 =====
  // 主标题 中国乒乓
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `900 200px ${RIGHT.text.fontMain}`;
  // 阴影
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillText(RIGHT.text.main, RIGHT.cx + 8, 520 + 8);
  // 白色粗描边（增强可读性）
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 12;
  ctx.lineJoin = 'round';
  ctx.strokeText(RIGHT.text.main, RIGHT.cx, 520);
  // 金色渐变填充
  const mainRg = ctx.createLinearGradient(2000, 350, 2000, 700);
  mainRg.addColorStop(0, '#FFE88A');
  mainRg.addColorStop(0.5, '#FFDE00');
  mainRg.addColorStop(1, '#E6B800');
  ctx.fillStyle = mainRg;
  ctx.fillText(RIGHT.text.main, RIGHT.cx, 520);
  // 深色细描边
  ctx.strokeStyle = '#5a1005';
  ctx.lineWidth = 4;
  ctx.strokeText(RIGHT.text.main, RIGHT.cx, 520);
  ctx.restore();

  // 副标题
  drawCenteredSegments(RIGHT.cx, 720, [
    { text: RIGHT.text.sub, font: `bold 56px ${RIGHT.text.fontBody}`, color: '#ffffff' }
  ]);

  // 辅助文案
  drawCenteredSegments(RIGHT.cx, 810, [
    { text: RIGHT.text.helper, font: `36px ${RIGHT.text.fontBody}`, color: 'rgba(255,255,255,0.85)' }
  ]);

  // 装饰文字（竖排标签）
  ctx.save();
  ctx.translate(RIGHT.x0 + 130, 1000);
  ctx.rotate(-Math.PI / 2);
  ctx.font = `bold 44px ${RIGHT.text.fontMain}`;
  ctx.fillStyle = RIGHT.color2;
  ctx.fillText(RIGHT.text.deco[0], 0, 0);
  ctx.restore();

  ctx.save();
  ctx.translate(RIGHT.x1 - 130, 1700);
  ctx.rotate(Math.PI / 2);
  ctx.font = `bold 44px ${RIGHT.text.fontMain}`;
  ctx.fillStyle = '#ffffff';
  ctx.fillText(RIGHT.text.deco[1], 0, 0);
  ctx.restore();

  // 银球飞旋 圆形标签
  ctx.save();
  ctx.translate(RIGHT.cx, 2200);
  ctx.beginPath();
  ctx.arc(0, 0, 140, 0, Math.PI * 2);
  ctx.fillStyle = RIGHT.color2;
  ctx.fill();
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 6;
  ctx.stroke();
  ctx.font = `bold 40px ${RIGHT.text.fontMain}`;
  ctx.fillStyle = RIGHT.color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(RIGHT.text.deco[2], 0, -25);
  ctx.fillText('★', 0, 35);
  ctx.restore();
}

// ===== 底部口号条 =====
function drawSlogans() {
  const sloganY = H - 280;
  const sloganH = 160;

  // 左侧口号条
  ctx.save();
  ctx.fillStyle = '#1a1a1a';
  ctx.globalAlpha = 0.85;
  ctx.fillRect(LEFT.x0 + 60, sloganY, LEFT.x1 - LEFT.x0 - 120, sloganH);
  ctx.globalAlpha = 1;
  // 左侧色带
  ctx.fillStyle = LEFT.color2;
  ctx.fillRect(LEFT.x0 + 60, sloganY, 30, sloganH);
  ctx.font = `bold 72px ${LEFT.text.fontMain}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffffff';
  ctx.fillText(LEFT.text.slogan, LEFT.cx + 15, sloganY + sloganH / 2);
  ctx.restore();

  // 右侧口号条
  ctx.save();
  ctx.fillStyle = '#1a1a1a';
  ctx.globalAlpha = 0.85;
  ctx.fillRect(RIGHT.x0 + 60, sloganY, RIGHT.x1 - RIGHT.x0 - 120, sloganH);
  ctx.globalAlpha = 1;
  ctx.fillStyle = RIGHT.color2;
  ctx.fillRect(RIGHT.x1 - 90, sloganY, 30, sloganH);
  ctx.font = `bold 64px ${RIGHT.text.fontMain}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffffff';
  ctx.fillText(RIGHT.text.slogan, RIGHT.cx - 15, sloganY + sloganH / 2);
  ctx.restore();
}

// ===== 底部品牌文字 =====
function drawFooter() {
  ctx.save();
  ctx.font = '36px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillText('SPORT CULTURE POSTER · 40×60cm', W / 2, H - 60);
  ctx.restore();
}

// ===== 主渲染 =====
function renderPoster() {
  loadingEl.style.display = 'block';
  loadingEl.textContent = '渲染中...';

  // 清空
  ctx.clearRect(0, 0, W, H);

  // 分层绘制
  drawBackground();
  drawLeftDecorations();
  drawRightDecorations();
  drawCenterCollision();
  drawTexts();
  drawSlogans();
  drawFooter();

  loadingEl.style.display = 'none';
}

// ===== 下载 =====
function downloadPoster() {
  loadingEl.style.display = 'block';
  loadingEl.textContent = '正在生成 PNG 文件（4000×6000 较大，请稍候）...';

  const triggerDownload = (dataUrl) => {
    const link = document.createElement('a');
    link.download = 'SPORT_CULTURE_Poster_4000x6000.png';
    link.href = dataUrl;
    link.click();
    loadingEl.style.display = 'none';
  };

  if (canvas.toBlob) {
    canvas.toBlob((blob) => {
      if (blob) {
        const url = URL.createObjectURL(blob);
        triggerDownload(url);
        setTimeout(() => URL.revokeObjectURL(url), 5000);
      } else {
        // fallback to toDataURL
        triggerDownload(canvas.toDataURL('image/png'));
      }
    }, 'image/png');
  } else {
    triggerDownload(canvas.toDataURL('image/png'));
  }
}

// ===== 适应屏幕切换 =====
function toggleFit() {
  canvas.classList.toggle('fit-screen');
}

// 启动
window.onload = () => {
  setTimeout(renderPoster, 100);
};
</script>

</body>
</html>
